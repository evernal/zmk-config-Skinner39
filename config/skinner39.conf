# === BLUETOOTH PERFORMANCE / BATTERY BALANCE ===
# Tuned for responsive trackball with lower battery drain.

# Connection interval: balanced low-latency range (11.25ms - 15ms)
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=9
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400

# Buffer sizes for improved throughput
CONFIG_BT_BUF_ACL_TX_COUNT=20
CONFIG_BT_BUF_EVT_RX_COUNT=21
CONFIG_BT_L2CAP_TX_BUF_COUNT=64
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_SIZE=251

# TX power and PHY settings: lower power while keeping good responsiveness
# (keeps trackball responsiveness while reducing radio drain)
CONFIG_BT_CTLR_TX_PWR_0=y
# CONFIG_BT_CTLR_TX_PWR_PLUS_8 is not set
# CONFIG_BT_CTLR_PHY_2M is not set
CONFIG_BT_PHY_UPDATE=y
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
CONFIG_BT_DATA_LEN_UPDATE=y

# ZMK BLE optimizations
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
CONFIG_ZMK_BEHAVIORS_QUEUE_SIZE=512

# HID report queue sizes for trackball
CONFIG_ZMK_BLE_KEYBOARD_REPORT_QUEUE_SIZE=100
CONFIG_ZMK_BLE_CONSUMER_REPORT_QUEUE_SIZE=50

# Split keyboard queue sizes
CONFIG_ZMK_SPLIT_BLE_CENTRAL_POSITION_QUEUE_SIZE=50
CONFIG_ZMK_SPLIT_BLE_CENTRAL_SPLIT_RUN_QUEUE_SIZE=50

# Idle/sleep optimization
CONFIG_ZMK_IDLE_TIMEOUT=60000
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000